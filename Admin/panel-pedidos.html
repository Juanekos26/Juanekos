<section class="ventas-section">

    <div class="ventas-header">

        <div>

            <span class="admin-etiqueta">
                REGISTRO
            </span>

            <h2>
                Gestión de pedidos
            </h2>

            <p>
                Consulta y administra las órdenes registradas.
            </p>

        </div>

        <div class="ventas-header-actions">
            <button type="button" id="btnExportarJSON" class="btn-admin-exportar">⬇ EXPORTAR JSON</button>
            <button type="button" id="btnImportarJSON" class="btn-admin-importar">⬆ IMPORTAR JSON</button>
            <input type="file" id="archivoImportarJSON" accept="application/json,.json" hidden>
            <button type="button" id="btnActualizar" class="btn-actualizar">↻ ACTUALIZAR</button>
        </div>

    </div>

    <div class="panel-herramientas">

        <div class="buscador-pedidos">

            <label for="buscarPedido">
                🔎 Buscar pedido
            </label>

            <input
                type="search"
                id="buscarPedido"
                placeholder="N.º de pedido, cliente o mesa..."
                autocomplete="off"
            >

        </div>

        <div class="filtro-pedidos">

            <label for="filtroFecha">
                Fecha
            </label>

            <input
                type="date"
                id="filtroFecha"
                aria-label="Filtrar pedidos por fecha"
            >

        </div>

        <div class="filtro-pedidos">

            <label for="filtroEstado">
                Estado
            </label>

            <select
                id="filtroEstado"
                aria-label="Filtrar pedidos por estado"
            >
                <option value="">Todos</option>
                <option value="pendiente">Pendiente</option>
                <option value="cerrado">Cerrado</option>
                <option value="cancelado">Cancelado</option>
            </select>

        </div>

        <button
            type="button"
            id="btnLimpiarFiltros"
            class="btn-limpiar-filtros"
        >
            ✕ LIMPIAR
        </button>

    </div>

    <div class="tabla-contenedor">

        <table class="tabla-ventas">

            <thead>

                <tr>
                    <th>N.º</th>
                    <th>FECHA</th>
                    <th>HORA</th>
                    <th>CLIENTE</th>
                    <th>MESA</th>
                    <th>TOTAL</th>
                    <th>ACCIÓN</th>
                </tr>

            </thead>

            <tbody id="listaVentas">

                <tr>

                    <td
                        colspan="7"
                        class="sin-ventas"
                    >
                        No hay pedidos registrados.
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>
