<header class="admin-header">
    <div class="admin-brand">
        <span class="admin-etiqueta">JUANEKO'S</span>
        <h1>Panel Administrativo</h1>
        <p>Control y gestión de pedidos y ventas</p>
        <div class="admin-live"><span></span> Panel activo <strong id="adminReloj">--:--</strong></div>
    </div>

    <div class="admin-header-actions">
        <button type="button" id="btnIrPedidos" class="btn-cerrar admin-btn-quick">Pedidos</button>
        <button
        type="button"
        id="btnCerrarSesion"
        class="btn-cerrar"
    >
        Cerrar sesión
    </button>
    </div>
</header>

<section
    class="ventas-resumen"
    aria-label="Resumen de ventas y pedidos"
>

    <article class="resumen-card">
        <span class="resumen-icono">💰</span>

        <div>
            <small>VENTAS DE HOY</small>
            <strong id="ventasHoy">S/ 0.00</strong>
        </div>
    </article>

    <article class="resumen-card">
        <span class="resumen-icono">🧾</span>

        <div>
            <small>PEDIDOS DE HOY</small>
            <strong id="pedidosHoy">0</strong>
        </div>
    </article>

    <button
        type="button"
        class="resumen-card resumen-card-interactiva"
        id="btnEstadisticasVentas"
        data-estadistica="ventas"
        aria-label="Ver estadísticas de ventas"
    >
        <span class="resumen-icono">📊</span>

        <div>
            <small>VENTAS TOTALES</small>
            <strong id="ventasTotales">S/ 0.00</strong>
            <span class="resumen-ver">
                Ver estadísticas →
            </span>
        </div>
    </button>

    <button
        type="button"
        class="resumen-card resumen-card-interactiva"
        id="btnEstadisticasPedidos"
        data-estadistica="pedidos"
        aria-label="Ver estadísticas de pedidos"
    >
        <span class="resumen-icono">📋</span>

        <div>
            <small>PEDIDOS TOTALES</small>
            <strong id="pedidosTotales">0</strong>
            <span class="resumen-ver">
                Ver estadísticas →
            </span>
        </div>
    </button>

    <button
        type="button"
        class="resumen-card resumen-card-interactiva"
        id="btnEstadisticasPendientes"
        data-estadistica="pendientes"
        aria-label="Ver estadísticas de pedidos pendientes"
    >
        <span class="resumen-icono">⏳</span>

        <div>
            <small>PEDIDOS PENDIENTES</small>
            <strong id="pedidosPendientes">0</strong>
            <span class="resumen-ver">
                Ver estadísticas →
            </span>
        </div>
    </button>

    <button
        type="button"
        class="resumen-card resumen-card-interactiva"
        id="btnEstadisticasCancelados"
        data-estadistica="cancelados"
        aria-label="Ver estadísticas de pedidos cancelados"
    >
        <span class="resumen-icono">🚫</span>

        <div>
            <small>PEDIDOS CANCELADOS</small>
            <strong id="pedidosCancelados">0</strong>
            <span class="resumen-ver">
                Ver estadísticas →
            </span>
        </div>
    </button>

</section>

<section
    id="estadisticasPanel"
    class="estadisticas-panel"
    hidden
    aria-label="Estadísticas detalladas"
></section>
