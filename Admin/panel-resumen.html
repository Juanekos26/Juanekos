<div class="resumen-dashboard">

    <!-- Header principal -->
    <div class="resumen-header-full" style="background: linear-gradient(135deg, #122a4a, #0e203a); border-radius: 24px; padding: 24px 20px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.4);">
        <span style="color: #d4a017; font-size: 0.75rem; font-weight: 800; letter-spacing: 4px; display: block; margin-bottom: 6px;">JUANEKO'S</span>
        <h2 style="color: #ffffff; font-size: 1.85rem; font-weight: 900; margin: 0 0 12px 0; font-family: 'Playfair Display', serif;">Panel Administrativo</h2>
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
            <span style="width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; box-shadow: 0 0 10px #2ecc71; display: inline-block;"></span>
            <span style="color: #7a8ba3; font-size: 0.9rem; font-weight: 500;">Panel activo</span>
            <span style="color: #7a8ba3; font-size: 0.9rem;">·</span>
            <span id="adminReloj" style="color: #d4a017; font-size: 0.9rem; font-weight: 700;">--:--</span>
        </div>
    </div>

    <!-- PARTE 1: Fila de 2 tarjetas (Ventas de hoy / Pedidos de hoy) -->
    <div class="resumen-card-group" style="display: flex; gap: 16px;">
        <!-- Ventas de hoy -->
        <div style="flex: 1; background: #10233f; border-radius: 20px; padding: 20px 16px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(212, 160, 23, 0.1); border: 1px solid rgba(212, 160, 23, 0.2); display: flex; align-items: center; justify-content: center; color: #d4a017; font-size: 1.3rem; margin-bottom: 12px;">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <span style="color: #7a8ba3; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">VENTAS DE HOY</span>
            <strong id="ventasHoy" style="color: #ffffff; font-size: 1.35rem; font-weight: 800; display: block; margin-bottom: 4px;">S/ 0.00</strong>
            <span id="pedidosHoySub" style="color: #7a8ba3; font-size: 0.8rem; font-weight: 500;">0 pedidos</span>
        </div>

        <!-- Pedidos de hoy -->
        <div style="flex: 1; background: #10233f; border-radius: 20px; padding: 20px 16px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); display: flex; align-items: center; justify-content: center; color: #3b82f6; font-size: 1.3rem; margin-bottom: 12px;">
                <i class="fa-solid fa-clipboard"></i>
            </div>
            <span style="color: #7a8ba3; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">PEDIDOS DE HOY</span>
            <strong id="pedidosHoy" style="color: #ffffff; font-size: 1.5rem; font-weight: 800; display: block; margin-bottom: 4px;">0</strong>
            <span style="color: #7a8ba3; font-size: 0.78rem; font-weight: 500; line-height: 1.2;">Sin pedidos<br>registrados</span>
        </div>
    </div>

    <!-- Tarjeta Cevicheria -->
    <button type="button" class="resumen-card-interactiva" data-estadistica="cevicheria" style="width: 100%; background: #10233f; border-radius: 20px; padding: 22px 20px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(249, 115, 22, 0.1); border: 1px solid rgba(249, 115, 22, 0.2); display: flex; align-items: center; justify-content: center; color: #f97316; font-size: 1.3rem; margin-bottom: 12px;">
            <i class="fa-solid fa-fish"></i>
        </div>
        <span style="color: #7a8ba3; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">CEVICHERÍA</span>
        <strong id="ventasCevicheria" style="color: #ffffff; font-size: 1.6rem; font-weight: 800; display: block; margin-bottom: 4px;">S/ 0.00</strong>
        <span id="pedidosCevicheria" style="color: #7a8ba3; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px;">0 pedidos</span>
        <span style="color: #f97316; font-size: 0.8rem; font-weight: 600;">Ver gráfico diario →</span>
    </button>

    <!-- Tarjeta Broaster -->
    <button type="button" class="resumen-card-interactiva" data-estadistica="broaster" style="width: 100%; background: #10233f; border-radius: 20px; padding: 22px 20px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(234, 179, 8, 0.1); border: 1px solid rgba(234, 179, 8, 0.2); display: flex; align-items: center; justify-content: center; color: #eab308; font-size: 1.3rem; margin-bottom: 12px;">
            <i class="fa-solid fa-drumstick-bite"></i>
        </div>
        <span style="color: #7a8ba3; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">BROASTER</span>
        <strong id="ventasBroaster" style="color: #ffffff; font-size: 1.6rem; font-weight: 800; display: block; margin-bottom: 4px;">S/ 0.00</strong>
        <span id="pedidosBroaster" style="color: #7a8ba3; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px;">0 pedidos</span>
        <span style="color: #eab308; font-size: 0.8rem; font-weight: 600;">Ver gráfico diario →</span>
    </button>

    <!-- PARTE 2: Ventas Totales -->
    <button type="button" class="resumen-card-interactiva" data-estadistica="ventas" style="width: 100%; background: #10233f; border-radius: 20px; padding: 22px 20px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(212, 160, 23, 0.1); border: 1px solid rgba(212, 160, 23, 0.2); display: flex; align-items: center; justify-content: center; color: #d4a017; font-size: 1.3rem; margin-bottom: 12px;">
            <i class="fa-solid fa-chart-column"></i>
        </div>
        <span style="color: #7a8ba3; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">VENTAS TOTALES</span>
        <strong id="ventasTotales" style="color: #ffffff; font-size: 1.6rem; font-weight: 800; display: block; margin-bottom: 4px;">S/ 0.00</strong>
        <span id="pedidosTotalesCount" style="color: #7a8ba3; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px;">0 pedidos</span>
        <span style="color: #d4a017; font-size: 0.8rem; font-weight: 600;">Ver estadísticas →</span>
    </button>

    <!-- Pedidos Totales -->
    <button type="button" class="resumen-card-interactiva" data-estadistica="pedidos" style="width: 100%; background: #10233f; border-radius: 20px; padding: 22px 20px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); display: flex; align-items: center; justify-content: center; color: #3b82f6; font-size: 1.3rem; margin-bottom: 12px;">
            <i class="fa-solid fa-clipboard"></i>
        </div>
        <span style="color: #7a8ba3; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">PEDIDOS TOTALES</span>
        <strong id="pedidosTotales" style="color: #ffffff; font-size: 1.8rem; font-weight: 800; display: block; margin-bottom: 8px;">0</strong>
        <span style="color: #3b82f6; font-size: 0.8rem; font-weight: 600;">Ver estadísticas →</span>
    </button>

    <!-- Fila de 2 tarjetas (Pendientes / Cancelados) -->
    <div class="resumen-card-group" style="display: flex; gap: 16px;">
        <!-- Pendientes -->
        <button type="button" class="resumen-card-interactiva" data-estadistica="pendientes" style="flex: 1; background: #10233f; border-radius: 20px; padding: 20px 16px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; align-items: center; cursor: pointer;">
            <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(234, 179, 8, 0.1); border: 1px solid rgba(234, 179, 8, 0.2); display: flex; align-items: center; justify-content: center; color: #eab308; font-size: 1.3rem; margin-bottom: 12px;">
                <i class="fa-solid fa-hourglass-half"></i>
            </div>
            <span style="color: #7a8ba3; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">PEDIDOS PENDIENTES</span>
            <strong id="pedidosPendientes" style="color: #ffffff; font-size: 1.5rem; font-weight: 800; display: block;">0</strong>
        </button>

        <!-- Cancelados -->
        <button type="button" class="resumen-card-interactiva" data-estadistica="cancelados" style="flex: 1; background: #10233f; border-radius: 20px; padding: 20px 16px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; align-items: center; cursor: pointer;">
            <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); display: flex; align-items: center; justify-content: center; color: #ef4444; font-size: 1.3rem; margin-bottom: 12px;">
                <i class="fa-solid fa-xmark"></i>
            </div>
            <span style="color: #7a8ba3; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">PEDIDOS CANCELADOS</span>
            <strong id="pedidosCancelados" style="color: #ffffff; font-size: 1.5rem; font-weight: 800; display: block;">0</strong>
        </button>
    </div>

    <!-- Tarjeta Comparativa final -->
    <div style="background: #10233f; border-radius: 20px; padding: 24px 20px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05);">
        <h3 style="color: #ffffff; font-size: 1.3rem; font-weight: 800; margin: 0 0 4px 0; font-family: 'Playfair Display', serif;">Comparativa</h3>
        <p style="color: #7a8ba3; font-size: 0.85rem; margin: 0 0 16px 0;">Cevichería vs Broaster - Hoy</p>
        
        
        <div style="height: 180px; position: relative; margin-bottom: 16px;">
            <canvas id="resumenDoughnutChart"></canvas>
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;">
                <strong id="totalVentasDoughnut" style="color: #ffffff; font-size: 1.1rem; font-weight: 800; display: block;">S/ 0</strong>
                <span style="color: #7a8ba3; font-size: 0.7rem; font-weight: 700;">Total</span>
            </div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0 10px;">
            <div style="display: flex; align-items: center; gap: 6px;">
                <span style="width: 12px; height: 12px; background: #3b82f6; border-radius: 50%; display: inline-block;"></span>
                <span style="color: #7a8ba3;">Cevichería</span> <strong id="porcentajeCevicheria" style="color: #ffffff;">0%</strong>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
                <span style="width: 12px; height: 12px; background: #eab308; border-radius: 50%; display: inline-block;"></span>
                <span style="color: #7a8ba3;">Broaster</span> <strong id="porcentajeBroaster" style="color: #ffffff;">0%</strong>
            </div>
        </div>

    </div>

</div>

<section
    id="estadisticasPanel"
    class="estadisticas-panel"
    hidden
    aria-label="Estadísticas detalladas"
></section>
