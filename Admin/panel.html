<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Juaneko's | Panel Administrativo</title>


    <!-- =========================================
         ESTILOS GENERALES
    ========================================== -->

    <link
        rel="stylesheet"
        href="../Css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../Css/general.css"
    >


    <!-- =========================================
         ESTILOS DEL PANEL ADMINISTRATIVO
    ========================================== -->

    <link
        rel="stylesheet"
        href="../Css/admin/admin-general.css"
    >

    <link
        rel="stylesheet"
        href="../Css/admin/admin-panel.css"
    >

    <link
        rel="stylesheet"
        href="../Css/admin/admin-resumen.css"
    >

    <link
        rel="stylesheet"
        href="../Css/admin/admin-ventas.css"
    >

    <link
        rel="stylesheet"
        href="../Css/admin/admin-pedido.css"
    >

    <link
        rel="stylesheet"
        href="../Css/admin/admin-editor.css"
    >

    <link
        rel="stylesheet"
        href="../Css/admin/admin-responsive.css"
    >

    <link rel="stylesheet" href="../Css/admin/admin-ui.css">

    <link rel="stylesheet" href="../Css/admin/admin-modern.css">
</head>


<body>


<main class="admin-panel">


    <!-- =========================================
         RESUMEN
    ========================================== -->

    <section
        id="panelResumen"
        aria-label="Resumen administrativo"
    ></section>


    <!-- =========================================
         VENTAS / PEDIDOS
    ========================================== -->

    <section
        id="panelPedidos"
        aria-label="Pedidos y ventas"
    ></section>


    <!-- =========================================
         DETALLE DEL PEDIDO
    ========================================== -->

    <section
        id="panelDetalle"
        aria-label="Detalle del pedido"
    ></section>


    <!-- =========================================
         ESTADO DEL PEDIDO
    ========================================== -->

    <section
        id="panelEstado"
        aria-label="Estado del pedido"
    ></section>


    <!-- =========================================
         EDITAR PEDIDO
    ========================================== -->

    <section
        id="panelEditar"
        aria-label="Editar pedido"
    ></section>


    <!-- =========================================
         PRODUCTOS
    ========================================== -->

    <section
        id="panelProductos"
        aria-label="Productos"
    ></section>


    <!-- =========================================
         PIE DEL PANEL
    ========================================== -->

    <footer class="admin-footer">

        <span>
            JUANEKO'S
        </span>

        <p>
            Sistema de administración de ventas
        </p>

    </footer>


</main>

<div id="adminToastRegion" class="admin-toast-region" aria-live="polite" aria-atomic="true"></div>

<div id="adminConfirmModal" class="admin-modal" hidden>
    <div class="admin-modal-backdrop" data-modal-cancelar></div>
    <section class="admin-modal-card" role="dialog" aria-modal="true" aria-labelledby="adminConfirmTitulo" aria-describedby="adminConfirmMensaje">
        <div class="admin-modal-icon" aria-hidden="true">!</div>
        <h2 id="adminConfirmTitulo">Confirmar acción</h2>
        <p id="adminConfirmMensaje">¿Deseas continuar?</p>
        <div class="admin-modal-actions">
            <button type="button" id="adminConfirmCancelar" class="admin-btn admin-btn-secundario">Cancelar</button>
            <button type="button" id="adminConfirmAceptar" class="admin-btn admin-btn-primario">Confirmar</button>
        </div>
    </section>
</div>

<!-- =============================================
     ARCHIVOS PRINCIPALES
============================================= -->

<script src="../Js/menu.js"></script>

<script src="../Js/menucarta.js"></script>

<script src="../Js/pedido.js"></script>

<script src="../Js/admin.js"></script>


<!-- =============================================
     UTILIDADES DEL PANEL
============================================= -->

<script src="../Js/panel/panel-utilidades.js"></script>


<!-- =============================================
     MÓDULOS DEL PANEL
============================================= -->

<script src="../Js/panel/panel-resumen.js"></script>

<script src="../Js/panel/panel-ventas.js"></script>

<script src="../Js/panel/panel-detalle.js"></script>

<script src="../Js/panel/panel-estado.js"></script>

<script src="../Js/panel/panel-editar.js"></script>

<script src="../Js/panel/panel-impresion.js"></script>


<!-- =============================================
     CONTROL PRINCIPAL DEL PANEL
============================================= -->

<script src="../Js/panel/panel.js"></script>


</body>

</html>
