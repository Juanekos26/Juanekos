        </div>

                <span class="nav-text">Resumen</span>
            </button>
            <button class="nav-btn" data-target="panelPedidos" onclick="mostrarSeccion('panelPedidos', this)" title="Pedidos" style="display: flex; align-items: center; width: 100%; padding: 14px 18px; border-radius: 12px; border: none; background: transparent; color: #cbd5e1; font-weight: 600; font-size: 1rem; cursor: pointer; text-align: left; transition: background 0.2s, color 0.2s;">
                <span class="nav-text" style="flex: 1;">Pedidos</span> 
                <span class="sidebar-badge" style="background: #f59e0b; color: #061525; font-size: 0.75rem; font-weight: 800; padding: 2px 10px; border-radius: 20px;">13</span>
            </button>
            <button class="nav-btn" data-target="panelProductos" onclick="mostrarSeccion('panelProductos', this)" title="Productos" style="display: flex; align-items: center; width: 100%; padding: 14px 18px; border-radius: 12px; border: none; background: transparent; color: #cbd5e1; font-weight: 600; font-size: 1rem; cursor: pointer; text-align: left; transition: background 0.2s, color 0.2s;">
                <span class="nav-text">Productos</span>
            </button>
            <button class="nav-btn" data-target="panelMenuDia" onclick="mostrarSeccion('panelMenuDia', this)" title="Menú del Día" style="display: flex; align-items: center; width: 100%; padding: 14px 18px; border-radius: 12px; border: none; background: transparent; color: #cbd5e1; font-weight: 600; font-size: 1rem; cursor: pointer; text-align: left; transition: background 0.2s, color 0.2s;">
                <span class="nav-text">Menú del día</span>

            <button class="nav-btn" data-target="panelInsumos" onclick="mostrarSeccion('panelInsumos', this)" title="Insumos" style="display: flex; align-items: center; width: 100%; padding: 14px 18px; border-radius: 12px; border: none; background: transparent; color: #cbd5e1; font-weight: 600; font-size: 1rem; cursor: pointer; text-align: left; transition: background 0.2s, color 0.2s;">

            </section>

            <section id="panelModoOperacion" aria-label="Modo de operación" style="display:none;"></section>
            <section id="panelPedidos" aria-label="Pedidos y ventas" style="display:none;"></section>
            <section id="panelMenuDia" aria-label="Administración del menú del día" style="display:none;"></section>
            <section id="panelInsumos" aria-label="Lista de insumos" style="display:none;"></section>
            <section id="panelUtensilios" aria-label="Lista de utensilios" style="display:none;"></section>
            <section id="panelDetalle" aria-label="Detalle del pedido" style="display:none;"></section>
            <section id="panelEstado" aria-label="Estado del pedido" style="display:none;"></section>
            <section id="panelEditar" aria-label="Editar pedido" style="display:none;"></section>
            <section id="panelProductos" aria-label="Productos" style="display:none;"></section>

            <footer class="admin-footer">
                <span>JUANEKO'S</span>
                <p>Sistema de administración de ventas</p>
            </footer>

        </main>
    </div>

</div>

<script src="../Js/panel/sidebar.js"></script>
<script>
    function mostrarSeccion(targetId, btnElement) {
        const rolActual = (typeof obtenerRolPanel === 'function' ? obtenerRolPanel() : null);
        if (!rolActual) return;
        if (rolActual === 'mesero' && targetId !== 'panelPedidos') { targetId = 'panelPedidos'; btnElement = document.querySelector('.sidebar-nav .nav-btn[data-target="panelPedidos"]'); }
        // Remove active class from all buttons
        document.querySelectorAll('.sidebar-nav .nav-btn').forEach(btn => btn.classList.remove('active'));
        // Add active class to clicked button when available
        if (!btnElement) btnElement = document.querySelector(`.sidebar-nav .nav-btn[data-target="${targetId}"]`);
        if (btnElement) btnElement.classList.add('active');
        
        const sections = [
            'panelResumen', 'panelPedidos', 'panelProductos', 'panelMenuDia', 
            'panelModoOperacion', 'panelCarta', 'panelEstadisticas', 'panelConfiguracion',
            'panelInsumos', 'panelUtensilios', 'panelDetalle', 'panelEstado', 'panelEditar'
        ];
        
        sections.forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                // If target is panelVentas, show Resumen and Pedidos like the original logic did
                if(targetId === id) {
                    el.style.display = 'block';
                } else {
                    el.style.display = 'none';
                }
            }
        });
        
        // Cerrar cualquier subvista activa sin destruir los componentes cargados.
        // Antes se vaciaba panelDetalle/panelEditar con innerHTML = '', y eso
        // provocaba que el botón "Ver" dejara una pantalla en blanco.
        document.body.classList.remove('panel-subview-open');
        delete document.body.dataset.adminSubview;

        // On mobile, close sidebar automatically
        if (targetId === 'panelEstadisticas' && typeof renderizarPanelEstadisticas === 'function') renderizarPanelEstadisticas();
        if (targetId === 'panelModoOperacion' && typeof configurarModoOperacionAdmin === 'function') configurarModoOperacionAdmin();
        if (targetId === 'panelConfiguracion' && typeof configurarPanelPreferencias === 'function') configurarPanelPreferencias();
        if (targetId === 'panelInsumos' && typeof renderizarPanelInsumos === 'function') renderizarPanelInsumos();
        if (targetId === 'panelUtensilios' && typeof renderizarPanelUtensilios === 'function') renderizarPanelUtensilios();

        if (window.innerWidth <= 900) {
            const sidebar = document.getElementById('adminSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
    }
</script>
