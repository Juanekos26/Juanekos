<body class="panel-auth-pending">


<div class="admin-wrapper">

    <!-- Overlay para móviles -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- BARRA LATERAL -->
    <aside id="adminSidebar" class="admin-sidebar">
        <div class="sidebar-header">
            <img src="../Logo/Logo.png" alt="Juaneko's Logo" class="sidebar-logo">
            <h2 class="sidebar-title">JUANEKO'S</h2>
            <button id="closeSidebarMobile" class="close-sidebar-btn" aria-label="Cerrar menú">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <nav class="sidebar-nav">
            <button class="nav-btn active" data-target="panelResumen" onclick="mostrarSeccion('panelResumen', this)" title="Resumen">
                <i class="fa-solid fa-chart-pie"></i> <span class="nav-text">Resumen</span>
            </button>
            <button class="nav-btn" data-target="panelPedidos" onclick="mostrarSeccion('panelPedidos', this)" title="Pedidos">
                <i class="fa-solid fa-list-check"></i> <span class="nav-text">Pedidos</span>
            </button>
            <button class="nav-btn" data-target="panelProductos" onclick="mostrarSeccion('panelProductos', this)" title="Productos">
                <i class="fa-solid fa-burger"></i> <span class="nav-text">Productos</span>
            </button>
            <button class="nav-btn" data-target="panelMenuDia" onclick="mostrarSeccion('panelMenuDia', this)" title="Menú del Día">
                <i class="fa-solid fa-utensils"></i> <span class="nav-text">Menú del día</span>
            </button>
            <button class="nav-btn" data-target="panelModoOperacion" onclick="mostrarSeccion('panelModoOperacion', this)" title="Modo de operación">
                <i class="fa-solid fa-store"></i> <span class="nav-text">Modo de operación</span>
            </button>
            <button class="nav-btn" data-target="panelEstadisticas" onclick="mostrarSeccion('panelEstadisticas', this)" title="Estadísticas">
                <i class="fa-solid fa-chart-simple"></i> <span class="nav-text">Estadísticas</span>
            </button>
            <button class="nav-btn" data-target="panelConfiguracion" onclick="mostrarSeccion('panelConfiguracion', this)" title="Configuración">
                <i class="fa-solid fa-gear"></i> <span class="nav-text">Configuración</span>
            </button>
            <button id="btnCerrarSesionSidebar" data-admin-logout class="nav-btn btn-exit" title="Cerrar sesión">
                <i class="fa-solid fa-right-from-bracket"></i> <span class="nav-text">Cerrar sesión</span>
            </button>
        </nav>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="admin-main-wrapper">
        
        <!-- BARRA SUPERIOR -->
        <header class="admin-topbar">
            <div class="topbar-left">
                <button id="toggleSidebarBtn" class="toggle-sidebar-btn" aria-label="Alternar menú lateral">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="topbar-title">Administración</h1>
            </div>
            
            <div class="topbar-right">
                <div class="topbar-notifications" title="Notificaciones" tabindex="0">
                    <i class="fa-solid fa-bell"></i>
                    <span class="notification-badge">3</span>
                </div>
                <div class="topbar-profile" tabindex="0">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Perfil">
                    <span>Admin</span>
                </div>
            </div>
        </header>

        <!-- ÁREA DE PANELES -->
        <main class="admin-content">

            <section id="panelResumen" aria-label="Resumen administrativo"></section>
            
            <!-- Simulamos paneles vacíos para las nuevas opciones para evitar errores -->
            <section id="panelCarta" aria-label="Carta" style="display:none;">
                <div class="admin-empty-state">
                    <i class="fa-solid fa-book-open"></i>
                    <h3>Gestión de Carta</h3>
                    <p>Módulo en desarrollo.</p>
                </div>
            </section>
            
            <section id="panelEstadisticas" aria-label="Estadísticas" style="display:none;"></section>
            
            <section id="panelConfiguracion" aria-label="Configuración" style="display:none;"></section>

            <section id="panelModoOperacion" aria-label="Modo de operación" style="display:none;"></section>
            <section id="panelPedidos" aria-label="Pedidos y ventas" style="display:none;"></section>
            <section id="panelMenuDia" aria-label="Administración del menú del día" style="display:none;"></section>
            <section id="panelDetalle" aria-label="Detalle del pedido" style="display:none;"></section>
            <section id="panelEstado" aria-label="Estado del pedido" style="display:none;"></section>
            <section id="panelEditar" aria-label="Editar pedido" style="display:none;"></section>
            <section id="panelProductos" aria-label="Productos" style="display:none;"></section>

            <footer class="admin-footer">
                <span>JUANEKO'S</span>
                <p>Sistema de administración de ventas</p>
            </footer>

        </main>
    </div>

</div>

<script src="../Js/panel/sidebar.js"></script>
<script>
    function mostrarSeccion(targetId, btnElement) {
        const rolActual = (typeof obtenerRolPanel === 'function' ? obtenerRolPanel() : null);
        if (!rolActual) return;
        if (rolActual === 'mesero' && targetId !== 'panelPedidos') { targetId = 'panelPedidos'; btnElement = document.querySelector('.sidebar-nav .nav-btn[data-target="panelPedidos"]'); }
        // Remove active class from all buttons
        document.querySelectorAll('.sidebar-nav .nav-btn').forEach(btn => btn.classList.remove('active'));
        // Add active class to clicked button when available
        if (!btnElement) btnElement = document.querySelector(`.sidebar-nav .nav-btn[data-target="${targetId}"]`);
        if (btnElement) btnElement.classList.add('active');
        
        const sections = [
            'panelResumen', 'panelPedidos', 'panelProductos', 'panelMenuDia', 
            'panelModoOperacion', 'panelCarta', 'panelEstadisticas', 'panelConfiguracion',
            'panelDetalle', 'panelEstado', 'panelEditar'
        ];
        
        sections.forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                // If target is panelVentas, show Resumen and Pedidos like the original logic did
                if(targetId === id) {
                    el.style.display = 'block';
                } else {
                    el.style.display = 'none';
                }
            }
        });
        
        // Cerrar cualquier subvista activa sin destruir los componentes cargados.
        // Antes se vaciaba panelDetalle/panelEditar con innerHTML = '', y eso
        // provocaba que el botón "Ver" dejara una pantalla en blanco.
        document.body.classList.remove('panel-subview-open');
        delete document.body.dataset.adminSubview;

        // On mobile, close sidebar automatically
        if (targetId === 'panelEstadisticas' && typeof renderizarPanelEstadisticas === 'function') renderizarPanelEstadisticas();
        if (targetId === 'panelModoOperacion' && typeof configurarModoOperacionAdmin === 'function') configurarModoOperacionAdmin();
        if (targetId === 'panelConfiguracion' && typeof configurarPanelPreferencias === 'function') configurarPanelPreferencias();

        if (window.innerWidth <= 900) {
            const sidebar = document.getElementById('adminSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
    }
</script>

<div id="adminToastRegion" class="admin-toast-region" aria-live="polite" aria-atomic="true"></div>

<div id="adminConfirmModal" class="admin-modal" hidden>
    <div class="admin-modal-backdrop" data-modal-cancelar></div>
    <section class="admin-modal-card" role="dialog" aria-modal="true" aria-labelledby="adminConfirmTitulo" aria-describedby="adminConfirmMensaje">
        <div class="admin-modal-icon" aria-hidden="true">!</div>
        <h2 id="adminConfirmTitulo">Confirmar acción</h2>
        <p id="adminConfirmMensaje">¿Deseas continuar?</p>
        <div class="admin-modal-actions">
            <button type="button" id="adminConfirmCancelar" class="admin-btn admin-btn-secundario">Cancelar</button>
            <button type="button" id="adminConfirmAceptar" class="admin-btn admin-btn-primario">Confirmar</button>
        </div>
    </section>
