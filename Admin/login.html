<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Juaneko's | Administrador</title>

    <link rel="stylesheet" href="../Css/variables.css">
<link rel="stylesheet" href="../Css/general.css">
<link rel="stylesheet" href="../Css/admin/admin-general.css">
<link rel="stylesheet" href="../Css/admin/admin-login.css">
<link rel="stylesheet" href="../Css/admin/admin-responsive.css">

</head>

<body>

    <main class="admin-login">

        <section class="login-card">

            <div class="login-logo">
                <span>🍽️</span>
            </div>


            <div class="login-header">

                <span class="admin-etiqueta">
                    JUANEKO'S
                </span>

                <h1>
                    Administrador
                </h1>

                <p>
                    Ingresa para gestionar las ventas
                </p>

            </div>


            <form id="loginForm">

                <div class="admin-campo">

                    <label for="usuario">
                        👤 Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="admin-campo">

                    <label for="clave">
                        🔒 Contraseña
                    </label>

                    <input
                        type="password"
                        id="clave"
                        name="clave"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <p
                    id="loginMensaje"
                    class="login-mensaje"
                    aria-live="polite"
                ></p>


                <button
                    type="submit"
                    class="btn-admin"
                >
                    INGRESAR
                </button>

            </form>


            <a
                href="../index.html"
                class="volver-inicio"
            >
                ← Volver al inicio
            </a>

        </section>

    </main>


    <script src="../Js/admin.js"></script>

</body>

</html>
