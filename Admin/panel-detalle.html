<section
    id="detallePedido"
    class="detalle-pedido"
    hidden
>

    <div class="detalle-header">

        <div>

            <span class="admin-etiqueta">
                DETALLE DEL PEDIDO
            </span>

            <h2>
                Pedido
                <span id="detalleNumero">—</span>
            </h2>

            <p id="detalleEstado">
                Estado del pedido
            </p>

        </div>

        <button
            type="button"
            id="cerrarDetalle"
            class="btn-cerrar-detalle"
            aria-label="Cerrar detalle"
        >
            Cerrar
        </button>

    </div>


    <div class="detalle-acciones">

        <button
            type="button"
            id="btnEditarPedido"
            class="btn-editar-pedido"
        >
            Editar
        </button>

        <button
            type="button"
            id="btnCambiarEstado"
            class="btn-estado-pedido"
        >
            Cambiar estado
        </button>

        <button
            type="button"
            id="btnImprimirDetalle"
            class="btn-imprimir-pedido"
        >
            Imprimir
        </button>

        <button
            type="button"
            id="btnCancelarPedido"
            class="btn-cancelar-pedido"
        >
            Cancelar
        </button>

    </div>


    <div
        id="selectorEstadoPedido"
        class="selector-estado-pedido"
        hidden
    >

        <label for="nuevoEstadoPedido">
            Estado del pedido
        </label>

        <select id="nuevoEstadoPedido">

            <option value="pendiente">
                Pendiente
            </option>

            <option value="cerrado">
                Cerrado
            </option>

            <option value="cancelado">
                Cancelado
            </option>

        </select>

        <div class="acciones-estado">

            <button
                type="button"
                id="btnGuardarEstado"
            >
                Guardar estado
            </button>

            <button
                type="button"
                id="btnCancelarCambioEstado"
            >
                Cancelar
            </button>

        </div>

    </div>


    <div
        id="detalleContenido"
        class="detalle-contenido"
    ></div>

</section>
