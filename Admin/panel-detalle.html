<section
    id="detallePedido"
    class="detalle-pedido"
    hidden
>

    <div class="detalle-header">

        <div>

            <span class="admin-etiqueta">
                DETALLE DEL PEDIDO
            </span>

            <h2>
                Pedido
                <span id="detalleNumero">—</span>
            </h2>

            <p id="detalleEstado">
                Estado del pedido
            </p>

        </div>

        <button
            type="button"
            id="cerrarDetalle"
            class="btn-cerrar-detalle"
            aria-label="Cerrar detalle"
        >
            ✕
        </button>

    </div>


    <div class="detalle-acciones">

        <button
            type="button"
            id="btnEditarPedido"
            class="btn-editar-pedido"
        >
            Editar pedido
        </button>


        <button
            type="button"
            id="btnCambiarEstado"
            class="btn-estado-pedido"
        >
            Cambiar estado
        </button>


        <button
            type="button"
            id="btnImprimirDetalle"
            class="btn-imprimir-pedido"
        >
            Imprimir
        </button>


        <button
            type="button"
            id="btnCerrarPedido"
            class="btn-cerrar-pedido"
        >
            Cerrar pedido
        </button>


        <button
            type="button"
            id="btnCancelarPedido"
            class="btn-cancelar-pedido"
        >
            Cancelar pedido
        </button>

    </div>


    <div
        id="detalleContenido"
        class="detalle-contenido"
    ></div>

</section>
