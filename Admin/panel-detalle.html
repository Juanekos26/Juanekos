<section
    id="detallePedido"
    class="detalle-pedido"
    hidden
>
    <div class="detalle-header">

        <div class="detalle-header-info">
            <span class="admin-etiqueta">
                <i class="fa-solid fa-receipt" style="margin-right: 6px;"></i>DETALLE DEL PEDIDO
            </span>

            <h2>
                Pedido
                <span id="detalleNumero" class="detalle-numero-destacado">—</span>
            </h2>

            <div id="detalleEstado" class="detalle-estado-wrapper">
                <!-- Estado badge dinámico -->
            </div>
        </div>

        <button
            type="button"
            id="cerrarDetalle"
            class="btn-cerrar-detalle"
            aria-label="Cerrar detalle"
            title="Cerrar detalle (Esc)"
        >
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>

    </div>

    <div class="detalle-acciones">

        <button
            type="button"
            id="btnEditarPedido"
            class="btn-detalle-accion btn-accion-editar btn-editar-pedido"
            title="Editar productos o datos del pedido"
        >
            <i class="fa-solid fa-pen-to-square"></i>
            <div class="btn-accion-textos">
                <strong>Editar Pedido</strong>
                <small>Modificar orden</small>
            </div>
        </button>

        <button
            type="button"
            id="btnCambiarEstado"
            class="btn-detalle-accion btn-accion-estado btn-estado-pedido"
            title="Modificar fase del pedido"
        >
            <i class="fa-solid fa-arrows-rotate"></i>
            <div class="btn-accion-textos">
                <strong>Cambiar Estado</strong>
                <small>Avanzar fase</small>
            </div>
        </button>

        <button
            type="button"
            id="btnImprimirDetalle"
            class="btn-detalle-accion btn-accion-imprimir btn-imprimir-pedido"
            title="Imprimir comanda o comprobante"
        >
            <i class="fa-solid fa-print"></i>
            <div class="btn-accion-textos">
                <strong>Imprimir</strong>
                <small>Comanda / Ticket</small>
            </div>
        </button>

        <button
            type="button"
            id="btnCerrarPedido"
            class="btn-detalle-accion btn-accion-cerrar btn-cerrar-pedido"
            title="Cobrar y cerrar el pedido (Confirmar pago)"
        >
            <i class="fa-solid fa-cash-register"></i>
            <div class="btn-accion-textos">
                <strong>Cerrar Pedido (Pagado)</strong>
                <small>Cobrado y liquidado</small>
            </div>
        </button>

        <button
            type="button"
            id="btnCancelarPedido"
            class="btn-detalle-accion btn-accion-cancelar btn-cancelar-pedido"
            title="Anular el pedido sin cobrar"
        >
            <i class="fa-solid fa-ban"></i>
            <div class="btn-accion-textos">
                <strong>Cancelar Pedido</strong>
                <small>Anular sin cobro</small>
            </div>
        </button>

    </div>

    <div
        id="detalleContenido"
        class="detalle-contenido"
    ></div>

</section>
