<section
    id="selectorProductos"
    class="selector-productos"
    hidden
>

    <div class="selector-productos-header">

        <div>

            <span class="admin-etiqueta">
                MENÚ
            </span>

            <h3>
                Agregar producto
            </h3>

            <p>Selecciona un producto permitido para el horario actual.</p>
            <div id="turnoProductoEditor" class="turno-producto-admin" aria-live="polite"></div>

        </div>

        <button
            type="button"
            id="cerrarSelectorProductos"
            class="btn-cerrar-detalle"
            aria-label="Cerrar selector de productos"
        >
            ✕
        </button>

    </div>

    <div class="selector-productos-filtros">

        <div class="editor-campo">

            <label for="buscarProductoEditor">
                🔎 Buscar producto
            </label>

            <input
                type="search"
                id="buscarProductoEditor"
                placeholder="Nombre del producto..."
                autocomplete="off"
            >

        </div>

        <div class="editor-campo">

            <label for="categoriaProductoEditor">
                📋 Categoría
            </label>

            <select id="categoriaProductoEditor">

                <option value="">
                    Todas las categorías
                </option>

                <option value="cevicheria">
                    Cevichería
                </option>

                <option value="broaster">
                    Broaster
                </option>

                <option value="bebidas">
                    Bebidas
                </option>

            </select>

        </div>

    </div>

    <div
        id="listaProductosDisponibles"
        class="lista-productos-disponibles"
    ></div>

</section>
