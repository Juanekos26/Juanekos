<section
    id="selectorEstadoPedido"
    class="selector-estado-pedido"
    hidden
>
    <div class="selector-estado-contenido">

        <div class="selector-estado-header">
            <div>
                <span class="admin-etiqueta">
                    ESTADO DEL PEDIDO
                </span>

                <h3>
                    Cambiar estado
                </h3>

                <p>
                    Pedido
                    <strong id="estadoPedidoNumero">—</strong>
                </p>
            </div>

            <button
                type="button"
                id="cerrarSelectorEstado"
                class="btn-cerrar-detalle"
                aria-label="Cerrar selector de estado"
            >
                <span aria-hidden="true">×</span>
            </button>
        </div>

        <div class="selector-estado-form">

            <label for="nuevoEstadoPedido">
                Selecciona el nuevo estado
            </label>

            <select id="nuevoEstadoPedido">
                <option value="inicio">Inicio</option>
                <option value="pendiente">Pendiente</option>
                <option value="listo">Listo</option>
                <option value="cerrado">Cerrado</option>
                <option value="cancelado">Cancelado</option>
            </select>

        </div>

        <div class="acciones-estado">

            <button
                type="button"
                id="btnGuardarEstado"
                class="btn-guardar-estado"
            >
                Guardar estado
            </button>

            <button
                type="button"
                id="btnCancelarCambioEstado"
                class="btn-cancelar-estado"
            >
                Cancelar
            </button>

        </div>

    </div>
</section>
